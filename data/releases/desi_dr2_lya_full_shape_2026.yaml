citation: DESI Collaboration, DESI DR2 Results IV, arXiv:2607.27410 (2026).
license: Public publication products; observe DESI acknowledgement and source-specific terms.
notes:
- The full-shape analysis combines Lyman-alpha forest auto-correlations and cross-correlations with quasars and adds broadband Alcock-Paczynski information beyond the BAO peak.
- The key result is reported at effective redshift z_eff=2.33.
- The companion validation paper is arXiv:2607.27411.
- Mock validation found a significant bias in the inferred growth-rate parameter f sigma_8, so that measurement was excluded from the final analysis and must not be ingested as a DESI DR2 Results IV constraint.
- This release is tracked separately from the pinned 2025 DESI DR2 Results I/II BAO covariance. Do not multiply overlapping products as independent data.
- No release-native joint covariance or likelihood combining this 2026 full-shape result with the repository's pinned 2025 Results I/II likelihood was identified in the official DESI data-product documentation at the 2026-08-17 verification date.
access:
  method: publication_tracking_until_release_native_likelihood_is_available
  base_url: https://arxiv.org/abs/2607.27410
  authentication: None.
  instructions:
  - Use the published values below only as a separately labelled comparator or holdout summary.
  - Before any joint inference, resolve an official DESI release-native likelihood or joint covariance and record its exact product identifiers and checksums.
  - Never infer or reconstruct an unprovided cross-covariance between the 2025 BAO likelihood and the 2026 full-shape result.
  - Do not use f sigma_8 from this analysis because the validation program excluded it from the final measurement.
  commands: []
products:
- id: published_joint_ap_bao_summary
  required: false
  purpose: Track the 2026 high-redshift Lyman-alpha AP+BAO result as a separate comparator pending release-native joint likelihood products.
  selection: Published DESI DR2 Results IV headline constraints at z_eff=2.33.
  formats:
  - publication
  expected_scale: summary values
  variables:
  - name: effective redshift
    symbol: z_eff
    unit: '1'
