  - name: radial BAO distance ratio
    symbol: D_H/r_d
    unit: '1'
    dimension: dimensionless
    shape: scalar
    description: Published joint AP+BAO result 8.600 +/- 0.066 at z_eff=2.33.
  - name: transverse BAO distance ratio
    symbol: D_M/r_d
    unit: '1'
    dimension: dimensionless
    shape: scalar
    description: Published joint AP+BAO result 39.32 +/- 0.33 at z_eff=2.33.
  - name: LambdaCDM matter fraction from Lyman-alpha AP
    symbol: Omega_m
    unit: '1'
    dimension: dimensionless
    shape: scalar
    description: Published LambdaCDM AP constraint 0.325 +/- 0.018; comparator only, not a native SCPC observable constraint.
  - name: LambdaCDM Hubble constant from Lyman-alpha plus BBN
    symbol: H_0
    unit: km s^-1 Mpc^-1
    dimension: T^-1
    shape: scalar
    description: Published LambdaCDM Lyman-alpha plus BBN constraint 66.5 +/- 1.3 km s^-1 Mpc^-1.
