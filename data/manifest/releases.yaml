manifest_version: 0.1.0
metadata:
  title: SCPC public cosmology data-release registry
  updated: "2026-07-28"
  maintainer: Jeremy Erich Resch
  scope: >-
    Public releases for parameter inference, validation, standardized model
    comparison, and reproducible visualization. Compact likelihoods and summary
    products are preferred; raw maps and catalogs are optional.
conventions:
  unit_system: Preserve release-native units and record conversions explicitly.
  dimension_vocabulary: {M: mass, L: length, T: time, Theta: temperature, A: angle, "1": dimensionless}
  relations:
    - "H=(da/dt)/a; dimensions T^-1"
    - "a=1/(1+z); dimensionless"
    - "D_ell=ell(ell+1)C_ell/(2*pi)"
    - "E(z)=H(z)/H0"
    - "Omega_GW=(1/rho_critical)d rho_GW/d ln f"
releases:
  - id: planck-2018-pr3
    title: Planck 2018 Legacy Release (PR3)
    provider: ESA / Planck Collaboration
    release_date: "2018-07-17"
    priority: core
    scientific_roles: [cmb_primary_likelihood, cmb_lensing, parameter_benchmark]
    landing_page: https://pla.esac.esa.int/
    documentation: [https://www.cosmos.esa.int/web/planck/publications]
    license: ESA archive terms; verify per product
    citation: Planck Collaboration 2018 results papers
    verified_on: "2026-07-28"
    products:
      - id: cosmology-products
        title: Plik/CamSpec, low-ell, lensing likelihoods and chains
        role: [parameter_fit, model_comparison]
        formats: [FITS, text, likelihood_code, tar.gz]
        approximate_size: product-dependent
        variable_inventory_complete: false
        access:
          method: archive_query
          url: https://pla.esac.esa.int/
          instructions: Select exact PR3 cosmology products; preserve product names, checksums, masks, nuisance conventions, and chain metadata.
        variables:
          - {name: cmb_angular_power_spectra, symbol: C_ell_XY, unit: "K^2 or microK^2 as declared", dimensions: Theta^2, coordinates: [ell, spectrum_type], resolution: release-native bins, description: Temperature and polarization spectra, relations: ["D_ell=ell(ell+1)C_ell/(2*pi)"]}
          - {name: covariance, unit: squared spectrum unit, dimensions: Theta^4, coordinates: [bandpower_index, bandpower_index], resolution: likelihood-native, description: Statistical and systematic covariance}

  - id: planck-pr4-npipe
    title: Planck PR4 / NPIPE maps and derived products
    provider: ESA / Planck Collaboration
    release_date: "2020"
    priority: extended
    scientific_roles: [cmb_map_validation, cmb_lensing_comparison]
    landing_page: https://pla.esac.esa.int/
    documentation: [https://pla.esac.esa.int/]
    license: ESA archive terms; verify per product
    citation: Planck Collaboration NPIPE release papers
    verified_on: "2026-07-28"
    products:
      - id: frequency-maps
        title: NPIPE frequency maps
        role: [optional_map_validation]
        formats: [FITS, HEALPix]
        approximate_size: multi-GB
        variable_inventory_complete: false
        access: {method: archive_query, url: https://pla.esac.esa.int/, instructions: Disable legacy-only filtering, select PR4 maps and matching masks/beams, and record NSIDE and checksum metadata.}
        variables:
          - {name: sky_temperature_polarization, unit: release-declared, dimensions: Theta, coordinates: [healpix_pixel, stokes_component, frequency], resolution: HEALPix NSIDE and beam FWHM per map, description: NPIPE processed sky maps}

