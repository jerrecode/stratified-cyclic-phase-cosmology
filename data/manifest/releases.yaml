    provider: LIGO / Virgo / KAGRA Collaborations
    release_date: "2023-2026"
    priority: extended
    scientific_roles: [gravitational_wave_background_validation, transient_constraints, detector_noise]
    landing_page: https://gwosc.org/O4/
    documentation: [https://gwosc.org/O4/]
    license: CC BY 4.0 for released O4 data
    citation: GWOSC and applicable O4 release documentation
    verified_on: "2026-07-28"
    products:
      - id: strain
        title: O4a and O4b calibrated detector strain
        role: [optional_gw_analysis, noise_validation]
        formats: [HDF5, GWF]
        approximate_size: very large; query by interval
        variable_inventory_complete: false
        access: {method: datafind, url: https://gwosc.org/O4/, instructions: Query detector, frame type, sample rate, and GPS interval through GWOSC/DataFind; avoid full-run bulk download by default, command_template: "gw_data_find -r datafind.gwosc.org -o H -t FRAME_TYPE -s GPS_START -e GPS_END -u file"}
        variables:
          - {name: strain, symbol: h_t, unit: "1", dimensions: "1", coordinates: [gps_time, detector], resolution: 4096 Hz or 16384 Hz products, description: Calibrated dimensionless gravitational-wave strain time series}

