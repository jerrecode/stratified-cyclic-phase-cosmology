  - id: desi-dr2-cosmology
    title: DESI Data Release 2 cosmology products
    provider: DESI Collaboration
    release_date: "2025"
    priority: core
    scientific_roles: [bao_likelihood, full_shape_likelihood, posterior_comparison]
    landing_page: https://data.desi.lbl.gov/doc/releases/dr2/
    documentation: [https://data.desi.lbl.gov/doc/releases/dr2/, https://github.com/cosmodesi/desi-y3-cosmology]
    license: DESI public data policy and repository licenses
    citation: DESI DR2 cosmology papers applicable to selected product
    verified_on: "2026-07-28"
    notes: DR2 cosmology products are public; underlying DR2 spectra/redshifts may follow a separate release schedule.
    products:
      - id: cosmology-repository
        title: BAO/full-shape likelihood inputs, chains, and posterior maximization products
        role: [parameter_fit, model_selection, visualization]
        formats: [git, YAML, text, chain, covariance]
        approximate_size: repository-scale
        variable_inventory_complete: false
        access: {method: git, url: https://github.com/cosmodesi/desi-y3-cosmology.git, ref: main, target_name: desi-y3-cosmology, instructions: Clone and record the exact commit; use only products tied to the cited DR2 analysis.}
        variables:
          - {name: distance_ratios, symbol: [DM_over_rd, DH_over_rd, DV_over_rd], unit: "1", dimensions: "1", coordinates: [redshift, tracer], resolution: release redshift bins, description: BAO distance measurements normalized by sound horizon}
          - {name: growth_rate, symbol: f_sigma8, unit: "1", dimensions: "1", coordinates: [redshift, tracer], resolution: analysis bins, description: Growth-rate observable where supplied}

