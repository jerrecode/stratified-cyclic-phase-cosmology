[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scpc-cosmology"
version = "0.1.0"
description = "Scientific computing framework for Stratified Cyclic Phase Cosmology"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Jeremy Erich Resch"}]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "jsonschema>=4.21",
  "xarray>=2024.1",
]

[project.optional-dependencies]
data = ["astropy>=6.0", "pandas>=2.2", "h5netcdf>=1.3"]
inference = ["cobaya>=3.5"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]

[project.scripts]
scpc = "scpc.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
packages = ["scpc"]

[tool.coverage.run]
source = ["scpc"]
branch = true
