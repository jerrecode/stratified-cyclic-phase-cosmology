[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "stratified-cyclic-phase-cosmology"
version = "0.1.0"
description = "Covariant cosmological modeling, simulation, falsification, and public-data comparison for Stratified Cyclic Phase Cosmology."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Jeremy Erich Resch"}]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "PyYAML>=6.0",
  "jsonschema>=4.20",
  "matplotlib>=3.9",
  "xarray>=2024.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
inference = [
  "cobaya>=3.5",
  "getdist>=1.5",
]

[project.scripts]
scpc = "scpc.cli:main"

[project.urls]
Repository = "https://github.com/jerrecode/stratified-cyclic-phase-cosmology"
Issues = "https://github.com/jerrecode/stratified-cyclic-phase-cosmology/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/scpc"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
