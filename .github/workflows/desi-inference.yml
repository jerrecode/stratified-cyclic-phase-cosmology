name: DESI DR2 posterior reproduction

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/scpc/inference/**'
      - 'src/scpc/models/layered.py'
      - 'src/scpc/visualization/**'
      - 'scripts/reproduce.py'
      - 'scripts/reproduce_desi_dr2_bbn.py'
      - 'configs/inference/desi_dr2_bbn.yaml'
      - 'data/analysis_ready/desi_dr2_bao/**'
      - 'paper/**'
      - '.github/workflows/desi-inference.yml'

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install inference environment
        run: python -m pip install -e '.[inference]'
      - name: Reproduce baseline, topology, and layered products
        run: python scripts/reproduce.py
      - name: Reproduce official-chain posterior and convergence products
        run: >-
          python scripts/reproduce_desi_dr2_bbn.py
          --download-official-chains
          --aubourg-samples 128
          --max-rminus1 0.01
      - name: Build inference-augmented manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          latexmk_use_xelatex: false
      - name: Upload publication inference products
        uses: actions/upload-artifact@v4
        with:
          name: scpc-publication-rigorous
          path: |
            results/desi_dr2_bbn
            results/scpc_verification
            results/layered_test
            paper/generated
            paper/main.pdf
          if-no-files-found: error
