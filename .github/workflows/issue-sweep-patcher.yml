          Path("configs/scans/stage1_resource_limit_smoke_base.yaml").write_text(
              '''schema_version: 1
          description: Deterministic RHS-budget exhaustion smoke baseline.
          model:
            background:
              spatial_curvature_k: 1
              rho_m_ref: 0.03
              rho_r_ref: 0.0001
