name: Ruff autofix science branch

on:
  push:
    branches:
      - science/manuscript-rigor-20260817

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: science/manuscript-rigor-20260817
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install 'ruff==0.16.3'
      - name: Apply safe Ruff fixes
        run: ruff check src tests scripts --fix || true
      - name: Commit autofixes
        run: |
          if git diff --quiet; then
            echo 'No Ruff autofixes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests scripts
          git commit -m 'apply deterministic Ruff autofixes'
          git push origin HEAD:science/manuscript-rigor-20260817
