name: Temporary issue-sweep apply 5

on:
  push:
    branches:
      - work/issue-sweep-2026-08-17
    paths:
      - .github/workflows/issue-sweep-apply5.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/issue-sweep-2026-08-17
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply previously validated source and CI transformation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/issue-sweep-apply4.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, '<issue-sweep-apply4-replay>', 'exec'), {'__name__': '__main__'})

          regression = Path('tests/test_domain_termination_review_regressions.py')
          text = regression.read_text(encoding='utf-8')
          old = "    def fake_solve_ivp(*_args, **_kwargs):\n        return SimpleNamespace(\n"
          new = (
              "    def fake_solve_ivp(*_args, **_kwargs):\n"
              "        solver_rhs = _args[0]\n"
              "        for _ in range(8):\n"
              "            solver_rhs(0.0, np.asarray([1.0, 0.0, 0.0, 0.0]))\n"
              "        return SimpleNamespace(\n"
          )
          count = text.count(old)
          if count != 2:
              raise RuntimeError(f'Expected two solve_ivp test doubles, found {count}')
          regression.write_text(text.replace(old, new), encoding='utf-8')

          metadata_test = Path('tests/test_scan_transactional_runner.py')
          text = metadata_test.read_text(encoding='utf-8')
          old = '    assert metadata["metadata_schema_version"] == 2\n'
          new = (
              '    assert metadata["metadata_schema_version"] == 3\n'
              '    assert metadata["resource_limits_by_run"] == {}\n'
          )
          count = text.count(old)
          if count != 1:
              raise RuntimeError(f'Expected one metadata schema assertion, found {count}')
          metadata_test.write_text(text.replace(old, new, 1), encoding='utf-8')

          for path in [regression, metadata_test, Path('tests/test_resource_limits.py')]:
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate style, YAML, and complete test suite
        shell: bash
        run: |
          ruff check --fix \
            src/scpc/models/__init__.py \
            tests/test_resource_limits.py \
            tests/test_domain_termination_review_regressions.py \
            tests/test_scan_transactional_runner.py
          ruff check src tests scripts
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in [
              Path('.github/workflows/ci.yml'),
              Path('configs/scans/stage1_resource_limit_smoke.yaml'),
              Path('configs/scans/stage1_resource_limit_smoke_base.yaml'),
          ]:
              parsed = yaml.safe_load(path.read_text(encoding='utf-8'))
              if not isinstance(parsed, dict):
                  raise RuntimeError(f'{path} did not parse as a mapping')
          PY
          pytest -q
      - name: Remove temporary issue-sweep infrastructure
        shell: bash
        run: |
          rm -f \
            .github/workflows/issue-sweep-patcher.yml \
            .github/workflows/issue-sweep-diagnostic.yml \
            .github/workflows/issue-sweep-script-debug.yml \
            .github/workflows/issue-sweep-script-debug2.yml \
            .github/workflows/issue-sweep-script-debug3.yml \
            .github/workflows/issue-sweep-script-debug4.yml \
            .github/workflows/issue-sweep-script-debug5.yml \
            .github/workflows/issue-sweep-script-debug6.yml \
            .github/workflows/issue-sweep-apply.yml \
            .github/workflows/issue-sweep-apply2.yml \
            .github/workflows/issue-sweep-apply3.yml \
            .github/workflows/issue-sweep-apply4.yml \
            .github/workflows/issue-sweep-apply5.yml
      - name: Commit and push issue 12 implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add deterministic RHS resource ceilings (#12)"
          git push origin HEAD:work/issue-sweep-2026-08-17
      - name: Build portable local-repository bundle
        shell: bash
        run: |
          git bundle create /tmp/scpc-issue-sweep.bundle HEAD
          git bundle verify /tmp/scpc-issue-sweep.bundle
      - uses: actions/upload-artifact@v4
        with:
          name: scpc-issue-sweep-git-bundle
          path: /tmp/scpc-issue-sweep.bundle
          if-no-files-found: error
