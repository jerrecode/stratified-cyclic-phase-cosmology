name: Temporary issue-sweep persist source

on:
  push:
    branches:
      - work/issue-sweep-2026-08-17
    paths:
      - .github/workflows/issue-sweep-persist-source.yml

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/issue-sweep-2026-08-17
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay validated implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/issue-sweep-apply5.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, '<validated-issue12-replay>', 'exec'), {'__name__': '__main__'})
          PY
      - name: Install and revalidate source
        shell: bash
        run: |
          python -m pip install -e ".[dev]"
          ruff check --fix \
            src/scpc/models/__init__.py \
            tests/test_resource_limits.py \
            tests/test_domain_termination_review_regressions.py \
            tests/test_scan_transactional_runner.py
          ruff check src tests scripts
          pytest -q
      - name: Commit only non-workflow implementation files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests configs docs
          git diff --cached --check
          git commit -m "feat: add deterministic RHS resource ceilings (#12)"
          git push origin HEAD:work/issue-sweep-2026-08-17
