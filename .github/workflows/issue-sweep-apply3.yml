name: Temporary issue-sweep apply 3

on:
  push:
    branches:
      - work/issue-sweep-2026-08-17
    paths:
      - .github/workflows/issue-sweep-apply3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/issue-sweep-2026-08-17
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply validated resource-limit implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/issue-sweep-patcher.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          needle = "    count = text.count(old)\n"
          replacement = r'''    if path == 'src/scpc/models/phase.py' and 'solver_nfev' in old and 'solver_status' in old:
              old = old.replace('\n        "solver_status"', '\n            "solver_status"')
          if path == 'src/scpc/scans/runner/__init__.py' and 'complete_fingerprint' in old and 'recovered_unreferenced_files' in old:
              old = old.replace('\n        "recovered_unreferenced_files"', '\n            "recovered_unreferenced_files"')
          if path == 'src/scpc/scans/resume.py' and 'Run-specification mismatch' in old:
              old = old.replace('\n        raise ValueError(f"Run-specification mismatch', '\n            raise ValueError(f"Run-specification mismatch')
              old = old.replace('\n    _validate_termination_row(', '\n        _validate_termination_row(')
              new = new.replace('\n        raise ValueError(f"Run-specification mismatch', '\n            raise ValueError(f"Run-specification mismatch')
          if path == '.github/workflows/ci.yml' and 'Upload background verification' in old:
              old = old.replace('\n    - name: Upload background verification', '\n      - name: Upload background verification')
              new = '''      - name: Run Stage 1 smoke scan
                run: scpc scan-background
              - name: Run deterministic resource-limit smoke scan
                run: >-
                  scpc scan-background
                  --config configs/scans/stage1_resource_limit_smoke.yaml
                  --output results/stage1_resource_limit_smoke
              - name: Assert resource-limit smoke semantics
                shell: bash
                run: |
                  python - <<'PY_ASSERT'
                  import csv
                  import json
                  from pathlib import Path

                  index = Path("results/stage1_resource_limit_smoke/scan_index.csv")
                  with index.open(newline="", encoding="utf-8") as handle:
                      rows = list(csv.DictReader(handle))
                  assert len(rows) == 1
                  row = rows[0]
                  assert row["status"] == "failed"
                  assert row["failure_class"] == "resource_limit_exceeded"
                  assert row["outcome"] == ""
                  assert row["termination_kind"] == ""
                  assert json.loads(row["termination_state_vector"]) is None
                  assert row["resource_limit_kind"] == "max_rhs_evaluations"
                  assert int(row["resource_limit_configured"]) == 1
                  assert int(row["resource_completed_count"]) == 1
                  assert int(row["resource_attempted_count"]) == 2
                  PY_ASSERT
              - name: Upload background verification
          '''
          if path == '.github/workflows/ci.yml' and 'Upload Stage 1 smoke scan' in old:
              new = old + '''      - name: Upload resource-limit smoke scan
                if: always() && hashFiles('results/stage1_resource_limit_smoke/**') != ''
                uses: actions/upload-artifact@v4
                with:
                  name: scpc-stage1-resource-limit-smoke
                  path: results/stage1_resource_limit_smoke
                  if-no-files-found: error
          '''
          count = text.count(old)
          '''
          if script.count(needle) != 1:
              raise RuntimeError('Could not patch replace_once exactly once')
          script = script.replace(needle, replacement, 1)
          exec(compile(script, '<issue-sweep-patcher-apply3>', 'exec'), {'__name__': '__main__'})

          test_path = Path('tests/test_resource_limits.py')
          test_text = test_path.read_text(encoding='utf-8').replace('from copy import deepcopy\n', '')
          test_path.write_text(test_text, encoding='utf-8')
          compile(test_text, str(test_path), 'exec')
          PY
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Apply deterministic Ruff import fixes
        run: ruff check --fix src/scpc/models/__init__.py tests/test_resource_limits.py
      - name: Validate style, configuration, and complete test suite
        shell: bash
        run: |
          ruff check src tests scripts
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in [
              Path('.github/workflows/ci.yml'),
              Path('configs/scans/stage1_resource_limit_smoke.yaml'),
              Path('configs/scans/stage1_resource_limit_smoke_base.yaml'),
          ]:
              parsed = yaml.safe_load(path.read_text(encoding='utf-8'))
              if not isinstance(parsed, dict):
                  raise RuntimeError(f'{path} did not parse as a mapping')
          PY
          pytest -q
      - name: Remove temporary patch infrastructure
        shell: bash
        run: |
          rm -f \
            .github/workflows/issue-sweep-patcher.yml \
            .github/workflows/issue-sweep-diagnostic.yml \
            .github/workflows/issue-sweep-script-debug.yml \
            .github/workflows/issue-sweep-script-debug2.yml \
            .github/workflows/issue-sweep-script-debug3.yml \
            .github/workflows/issue-sweep-script-debug4.yml \
            .github/workflows/issue-sweep-script-debug5.yml \
            .github/workflows/issue-sweep-script-debug6.yml \
            .github/workflows/issue-sweep-apply.yml \
            .github/workflows/issue-sweep-apply2.yml \
            .github/workflows/issue-sweep-apply3.yml
      - name: Commit and push issue 12 implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add deterministic RHS resource ceilings (#12)"
          git push origin HEAD:work/issue-sweep-2026-08-17
      - name: Build portable local-repo bundle
        shell: bash
        run: |
          git bundle create /tmp/scpc-issue-sweep.bundle HEAD
          git bundle verify /tmp/scpc-issue-sweep.bundle
      - uses: actions/upload-artifact@v4
        with:
          name: scpc-issue-sweep-git-bundle
          path: /tmp/scpc-issue-sweep.bundle
          if-no-files-found: error
