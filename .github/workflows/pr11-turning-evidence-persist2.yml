name: Temporary PR11 turning-evidence persist 2

on:
  push:
    branches:
      - fix/pr11-turning-evidence-2026-08-17
    paths:
      - .github/workflows/pr11-turning-evidence-persist2.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr11-turning-evidence-2026-08-17
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply validated evidence changes and compatible fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/pr11-turning-evidence-persist.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, '<validated-pr11-evidence-replay>', 'exec'), {'__name__': '__main__'})

          exact = Path('tests/test_exact_event_result_integrity.py')
          text = exact.read_text(encoding='utf-8')
          old_parameters = '''        parameters=SCPCParameters(
              spatial_curvature_k=0,
              rho_m_ref=0.0,
              rho_r_ref=0.0,
              potential=PeriodicPotential(offset=3.0, amplitude=0.0),
          ),
          solver_metadata={},
          turning_state_vectors=np.asarray([[1.2, 0.0, 0.0, 0.0]]),
          '''
          new_parameters = '''        parameters=SCPCParameters(
              spatial_curvature_k=1,
              rho_m_ref=0.0,
              rho_r_ref=0.0,
              potential=PeriodicPotential(offset=3.0, amplitude=0.0),
          ),
          solver_metadata={},
          turning_state_vectors=np.asarray([[1.2, 0.0, 0.0, 2.0 / 1.2]]),
          '''
          if text.count(old_parameters) != 1:
              raise RuntimeError(
                  f'Expected one exact-event synthetic fixture, found {text.count(old_parameters)}'
              )
          text = text.replace(old_parameters, new_parameters, 1)
          exact.write_text(text, encoding='utf-8')

          for path in [
              'src/scpc/scans/outcomes.py',
              'tests/test_scan_outcomes.py',
              'tests/test_exact_event_result_integrity.py',
          ]:
              compile(Path(path).read_text(encoding='utf-8'), path, 'exec')
          PY
      - name: Install and validate complete suite
        shell: bash
        run: |
          python -m pip install -e ".[dev]"
          ruff check --fix \
            src/scpc/scans/outcomes.py \
            tests/test_scan_outcomes.py \
            tests/test_exact_event_result_integrity.py
          ruff check src tests scripts
          pytest -q
      - name: Commit only production source and regression tests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/scpc/scans/outcomes.py \
            tests/test_scan_outcomes.py \
            tests/test_exact_event_result_integrity.py
          git diff --cached --check
          git commit -m "fix: authenticate turning-event evidence"
          git push origin HEAD:fix/pr11-turning-evidence-2026-08-17
