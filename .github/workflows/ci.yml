name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Lint Python
        id: ruff
        run: ruff check src tests scripts --output-format=concise 2>&1 | tee ruff-report.txt
      - name: Upload Ruff diagnostics
        if: failure() && steps.ruff.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostics
          path: ruff-report.txt
      - name: Run tests
        run: pytest --cov=scpc --cov-report=term-missing
      - name: Validate data manifest
        run: scpc validate-manifest
      - name: Reproduce baseline products
        run: python scripts/reproduce.py
      - name: Verify background numerics
        run: scpc verify-background
      - name: Upload background verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scpc-background-verification
          path: results/scpc_verification
          if-no-files-found: error
