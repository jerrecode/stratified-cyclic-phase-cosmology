name: Temporary issue-sweep diagnostic
on:
  push:
    branches: [work/issue-sweep-2026-08-17]
    paths: [.github/workflows/issue-sweep-diagnostic.yml]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/issue-sweep-2026-08-17
      - name: Count phase patch targets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/scpc/models/phase.py').read_text(encoding='utf-8')
          targets = {
              'constants': '''DOMAIN_TERMINATION_KIND_CODES = {\n    kind: index for index, kind in enumerate(DOMAIN_TERMINATION_KINDS, start=1)\n}\n\n\n@dataclass(frozen=True)\nclass PeriodicPotential:\n''',
              'ricci': '''def _ricci_scalar(state: np.ndarray, parameters: SCPCParameters) -> float:\n    a, H, _phi, _v = state\n    hdot = float(_rhs(0.0, state, parameters)[1])\n    return float(6.0 * (hdot + 2.0 * H**2 + parameters.spatial_curvature_k / a**2))\n''',
              'domain_definition': '''def _domain_event_definitions(\n    domain: SCPCIntegrationDomain,\n    parameters: SCPCParameters,\n) -> tuple[_DomainEventDefinition, ...]:\n''',
              'ricci_lambdas': '''        lambda state: abs(_ricci_scalar(state, parameters)),\n        lambda state: float(domain.max_abs_ricci_scalar - abs(_ricci_scalar(state, parameters))),\n''',
              'integrate_def': 'def integrate_scpc(\n',
              'signature_tail': '''    max_step: float | None = None,\n    domain_check_substeps: int = 16,\n) -> SCPCSolution:\n''',
              'domain_setup': '''    if domain_check_substeps < 2 or isinstance(domain_check_substeps, bool):\n        raise ValueError("domain_check_substeps must be an integer of at least 2")\n    definitions = _domain_event_definitions(domain, parameters) if domain is not None else ()\n    if definitions:\n''',
              'solve': '''    sol = solve_ivp(\n        lambda t, y: _rhs(t, y, parameters),\n        t_span,\n        initial_state,\n        method=method,\n        rtol=rtol,\n        atol=atol,\n        events=events,\n        dense_output=True,\n        max_step=solver_max_step,\n    )\n    if not sol.success:\n''',
              'turning_hdot': '        hdot = _rhs(float(event_time), state, parameters)[1]\n',
              'metadata': '''            "solver_nfev": int(sol.nfev),\n            "solver_status": int(sol.status),\n''',
          }
          for name, target in targets.items():
              print(name, text.count(target))
          for needle in ['solver_nfev', 'solver_status', 'hdot = _rhs', 'max_step=solver_max_step']:
              print('\n---', needle, '---')
              pos = text.find(needle)
              print(text[max(0,pos-180):pos+260] if pos >= 0 else '<missing>')
          PY