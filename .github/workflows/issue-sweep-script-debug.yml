name: Temporary issue-sweep script debug

on:
  push:
    branches:
      - work/issue-sweep-2026-08-17
    paths:
      - .github/workflows/issue-sweep-script-debug.yml

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/issue-sweep-2026-08-17
      - name: Replay patch script with replacement tracing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/issue-sweep-patcher.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          needle = "    count = text.count(old)\n"
          replacement = (
              "    count = text.count(old)\n"
              "    print(f'TRACE {path}: count={count}; target={old[:100]!r}')\n"
          )
          if script.count(needle) != 1:
              raise RuntimeError('Could not instrument replace_once exactly once')
          script = script.replace(needle, replacement, 1)
          exec(compile(script, '<issue-sweep-patcher-debug>', 'exec'), {'__name__': '__main__'})
          PY
