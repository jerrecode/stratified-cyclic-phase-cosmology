name: Paper

on:
  push:
    paths:
      - "paper/**"
      - "src/**"
      - "configs/**"
      - "scripts/**"
      - ".github/workflows/paper.yml"
  pull_request:
    paths:
      - "paper/**"
      - "src/**"
      - "configs/**"
      - "scripts/**"

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          latexmk_use_xelatex: false
      - uses: actions/upload-artifact@v4
        with:
          name: scpc-paper
          path: paper/main.pdf
